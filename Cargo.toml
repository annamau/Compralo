[workspace]
resolver = "2"
members = [
    "backend/crates/domain",
    "backend/crates/persistence",
    "backend/crates/rule-engine",
    "backend/crates/server",
    "backend/crates/execution",
    "backend/crates/merchant-demo",
    "backend/crates/monitoring",
    "backend/crates/product-intelligence",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "backend/crates/domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

