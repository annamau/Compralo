<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoBuy — decisions</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#242a31;--ink:#e8ebef;--muted:#8b95a1;--ok:#22c55e;--okbg:#0f2f1c;--bad:#ef4444;--badbg:#3a1414;--warn:#f59e0b;--warnbg:#3a2a0b;--accent:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line)}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.2)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.badge{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
main{padding:22px 28px;display:grid;gap:26px}
main>*{min-width:0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.col h2,section>h2{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;margin-bottom:12px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(96,165,250,.25)}
.card .name{font-weight:700;font-size:19px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px}
.card .big{font-size:28px;font-weight:800;margin-top:8px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pill.ACTIVE,.pill.EXECUTING,.pill.EVALUATING{background:#0d2a3d;color:var(--accent)}
.pill.PURCHASED{background:var(--okbg);color:var(--ok)}
.pill.NEEDS_ATTENTION{background:var(--warnbg);color:var(--warn)}
.pill.FAILED,.pill.EXPIRED,.pill.CANCELLED{background:var(--badbg);color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;background:#10141a}
td.offer{min-width:240px}
td.offer b{font-size:20px}
td.offer .total{font-size:26px;font-weight:800;line-height:1.2}
td.offer .title{color:var(--muted);font-size:14px;margin-top:2px}
td.chk{min-width:150px;border-left:1px solid var(--line)}
td.chk.pass{background:var(--okbg)} td.chk.fail{background:var(--badbg)}
td.chk .mark{font-size:24px;font-weight:900;line-height:1}
td.chk.pass .mark{color:var(--ok)} td.chk.fail .mark{color:var(--bad)}
td.chk .d{font-size:14px;margin-top:4px}
td.verdict{font-weight:800;white-space:nowrap;font-size:17px}
td.verdict.ok{color:var(--ok)} td.verdict.no{color:var(--bad)}
.empty{color:var(--muted);padding:26px;text-align:center}
.timeline{display:grid;gap:6px;font-size:15px}
.ev{display:grid;grid-template-columns:82px 250px 1fr;gap:12px;padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums}
.ev .ty{font-weight:700}
.ev.good .ty{color:var(--ok)} .ev.bad .ty{color:var(--bad)} .ev.warn .ty{color:var(--warn)} .ev.info .ty{color:var(--accent)}
footer{padding:16px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;gap:28px;flex-wrap:wrap}
footer b{color:var(--ink)}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.ev{grid-template-columns:70px 1fr}.ev span:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>AutoBuy</h1>
  <span id="dot" class="dot"></span><span id="conn" class="badge">connecting</span>
  <span id="ai" class="badge">AI: …</span><span id="stripe" class="badge">Stripe: …</span>
  <span class="badge" style="margin-left:auto">AI handles ambiguity · deterministic software handles money</span>
</header>
<main>
  <div class="cols">
    <div class="col"><h2>Active <span id="n-active"></span></h2><div id="col-active"></div></div>
    <div class="col"><h2>Needs attention <span id="n-attn"></span></h2><div id="col-attn"></div></div>
    <div class="col"><h2>Purchased <span id="n-done"></span></h2><div id="col-done"></div></div>
  </div>
  <section><h2 id="dtitle">Decision history</h2><div class="tablewrap"><table id="dtable"></table></div></section>
  <section><h2>Timeline</h2><div id="timeline" class="timeline"></div></section>
</main>
<footer id="usage">loading usage…</footer>
<script>
const $ = (id) => document.getElementById(id);
let instructions = [], events = [], selected = null, refetch = null;
const money = (n) => Number(n).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadAll() {
  [instructions, events] = await Promise.all([fetch("/instructions").then((r) => r.json()), fetch("/events").then((r) => r.json())]);
  if (!selected || !instructions.find((i) => i.id === selected)) selected = instructions[0]?.id ?? null;
  render();
}
function render() { renderCols(); renderTable(); renderTimeline(); }

function card(i) {
  const c = i.constraints;
  const v = Object.entries(c.variant || {}).map(([k, x]) => `${k}=${Array.isArray(x) ? x.join("|") : x}`).join(" · ");
  return `<div class="card ${i.id === selected ? "sel" : ""}" data-id="${i.id}">
    <span class="pill ${i.status}">${i.status.replace("_", " ")}</span>
    <div class="name">${esc(i.product.name)}</div>
    <div class="sub">≤ <b>${money(c.max_total)} ${c.currency}</b> · ${c.condition} · ${c.allow_bundles ? "bundles ok" : "no bundles"}${v ? " · " + esc(v) : ""}</div>
    <div class="sub">${c.approved_retailers.join(", ")} · until ${c.deadline.slice(0, 10)}</div>
    ${i.order ? `<div class="big">${money(i.order.total)} ${c.currency} <span class="sub">from <b>${esc(i.order.retailer)}</b></span></div><div class="sub">order ${esc(i.order.merchant_order_id)}</div>` : ""}
    <div class="sub mono" style="margin-top:8px">${i.id.slice(0, 8)} · ${esc(i.stripe_payment_intent ?? "no hold")}</div>
  </div>`;
}
function renderCols() {
  const g = { active: [], attn: [], done: [] };
  for (const i of instructions) (i.status === "PURCHASED" ? g.done : ["ACTIVE", "EXECUTING", "EVALUATING"].includes(i.status) ? g.active : g.attn).push(i);
  for (const k of ["active", "attn", "done"]) {
    $("col-" + k).innerHTML = g[k].map(card).join("") || `<div class="empty">none</div>`;
    $("n-" + k).textContent = g[k].length ? `(${g[k].length})` : "";
  }
  document.querySelectorAll(".card").forEach((el) => (el.onclick = () => { selected = el.dataset.id; render(); }));
}
function renderTable() {
  const rows = events.filter((e) => e.instruction_id === selected && ["OFFER_REJECTED", "OFFER_QUALIFIED", "REVALIDATED"].includes(e.type) && e.data?.checks);
  const i = instructions.find((x) => x.id === selected);
  $("dtitle").textContent = i ? `Decision history — ${i.product.name}` : "Decision history";
  if (!rows.length) { $("dtable").innerHTML = `<tr><td class="empty">No offers evaluated yet${i ? " — the agent polls the market every 3 s" : ""}.</td></tr>`; return; }
  const cols = [];
  for (const r of rows) for (const c of r.data.checks) if (!cols.includes(c.name)) cols.push(c.name);
  let h = `<tr><th>Offer</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}<th>Verdict</th></tr>`;
  for (const r of rows) {
    const o = r.data.offer || {}, by = Object.fromEntries(r.data.checks.map((c) => [c.name, c])), all = r.data.checks.every((c) => c.pass);
    h += `<tr><td class="offer"><b>${esc(o.retailer ?? "?")}</b> <span class="sub" style="font-size:13px">${r.at.slice(11, 19)}${r.type === "REVALIDATED" ? " · revalidation" : ""}</span>
      <div class="total">${o.total != null ? money(o.total) + " " + esc(o.currency || "") : ""}</div>
      <div class="title">${esc(o.listing_title)}${o.is_bundle ? " · bundle" : ""}</div></td>`;
    h += cols.map((c) => { const k = by[c]; return k ? `<td class="chk ${k.pass ? "pass" : "fail"}"><div class="mark">${k.pass ? "✓" : "✗"}</div><div class="d">${esc(k.detail)}</div></td>` : `<td class="chk"></td>`; }).join("");
    h += `<td class="verdict ${all ? "ok" : "no"}">${r.type === "REVALIDATED" ? (all ? "STILL QUALIFIES" : "NO LONGER QUALIFIES") : all ? "QUALIFIED" : "REJECTED"}</td></tr>`;
  }
  $("dtable").innerHTML = h;
}
const TONE = { PURCHASED: "good", OFFER_QUALIFIED: "good", PAYMENT_CAPTURED: "good", CHECKOUT_OK: "good", REVALIDATED: "info", LOCK_ACQUIRED: "info", CREATED: "info", OFFER_REJECTED: "bad", FAILED: "bad", CHECKOUT_PRICE_MISMATCH: "warn", PAYMENT_ACTION_REQUIRED: "warn" };
function renderTimeline() {
  const list = events.filter((e) => e.instruction_id === selected);
  $("timeline").innerHTML = list.length ? list.map((e) => `<div class="ev ${TONE[e.type] || ""}"><span class="t">${e.at.slice(11, 19)}</span><span class="ty">${e.type}</span><span>${esc(e.detail)}</span></div>`).join("") : `<div class="empty">no events yet</div>`;
}
async function usage() {
  try {
    const u = await fetch("/usage").then((r) => r.json());
    $("ai").textContent = `AI: ${u.ai === "claude" ? "claude-opus-5" : "hardcoded"}`;
    $("stripe").textContent = `Stripe: ${u.stripe}`;
    const f = (b) => `<b>${b.calls}</b> call${b.calls === 1 ? "" : "s"} · ${b.input_tokens + b.cache_read_tokens + b.cache_write_tokens} in / ${b.output_tokens} out · <b>$${b.usd.toFixed(4)}</b>`;
    const extra = Object.entries(u).filter(([k, v]) => !["understand", "normalise"].includes(k) && v && typeof v === "object" && "calls" in v && v.calls > 0).map(([k, v]) => `<span>${esc(k)}: ${f(v)}</span>`).join("");
    $("usage").innerHTML = `<span>understand: ${f(u.understand)}</span><span>normalise: ${f(u.normalise)} · ${u.normalise_cache} cached listing${u.normalise_cache === 1 ? "" : "s"}</span>${extra}<span>total <b>$${u.total_usd.toFixed(4)}</b></span>`;
  } catch {}
}
function connect() {
  const es = new EventSource("/events/stream");
  es.onopen = () => { $("dot").classList.add("on"); $("conn").textContent = "live"; loadAll(); };
  es.onerror = () => { $("dot").classList.remove("on"); $("conn").textContent = "reconnecting"; };
  es.onmessage = (m) => {
    const e = JSON.parse(m.data); events.push(e);
    if (e.type === "CREATED") selected = e.instruction_id;
    render();
    clearTimeout(refetch);
    refetch = setTimeout(async () => { instructions = await fetch("/instructions").then((r) => r.json()); if (!selected) selected = instructions[0]?.id ?? null; render(); usage(); }, 120);
  };
}
loadAll(); usage(); setInterval(usage, 5000); connect();
</script>
</body>
</html>
