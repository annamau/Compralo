services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: compralo-api:latest
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/buy-agent.sqlite?mode=rwc
      BITREFILL_PUBLIC_ORIGIN: ${BITREFILL_PUBLIC_ORIGIN:-}
      BITREFILL_ENCRYPTION_KEY: ${BITREFILL_ENCRYPTION_KEY:-}
      BITREFILL_CLIENT_ID: ${BITREFILL_CLIENT_ID:-}
      BITREFILL_PURCHASES_ENABLED: ${BITREFILL_PURCHASES_ENABLED:-false}
      BITREFILL_EXTENSION_ORIGIN: ${BITREFILL_EXTENSION_ORIGIN:-}
      RUST_LOG: ${RUST_LOG:-server=info,tower_http=info}
      SPIDER_CLOUD_API_KEY: ${SPIDER_CLOUD_API_KEY:?SPIDER_CLOUD_API_KEY is required}
    ports:
      - "8080:8080"
    volumes:
      - compralo-data:/data

volumes:
  compralo-data:
